[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scintegrate"
dynamic = ["version"]
description = "Is integration needed? Compare methods including none, benchmark with scIB, deliver one object"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Jiaen Lin" }]
keywords = ["single-cell", "integration", "batch-effect", "scIB", "scVI", "benchmark"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# The measurement layer is numpy + scikit-learn. Everything heavier is an extra, because a tool
# that is hard to install is a tool that gets skipped - and because each absence degrades to a
# NAMED absence in the report rather than stopping the run.
dependencies = ["numpy>=1.24", "scikit-learn>=1.3"]

[project.optional-dependencies]
# reading .h5ad and computing a PCA/UMAP. Needed by every command except `doctor`.
run = ["anndata>=0.10", "scanpy>=1.10", "matplotlib>=3.7"]

# one extra per comparable method, so you install the ones you actually want compared
harmony = ["harmonypy>=0.0.9"]
bbknn = ["bbknn>=1.6"]
# scvi-tools pulls torch and is by far the largest of these (~2.5 GB with CUDA wheels).
# It provides BOTH scVI and scANVI - they are one package, one install.
scvi = ["scvi-tools>=1.1"]
# the benchmark. Without it the run still happens and the tool's own kNN metrics are still
# reported, but NO DEFAULT EMBEDDING IS CHOSEN, because the choice is defined as the scIB total.
scib = ["scib>=1.1"]

# everything, for a machine where you want the full comparison
all = ["anndata>=0.10", "scanpy>=1.10", "matplotlib>=3.7", "harmonypy>=0.0.9", "bbknn>=1.6",
       "scvi-tools>=1.1", "scib>=1.1"]

test = ["anndata>=0.10", "scanpy>=1.10", "matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/JiaenLin/scIntegrate"
Issues = "https://github.com/JiaenLin/scIntegrate/issues"

[project.scripts]
scintegrate = "scintegrate.cli:main"

[tool.setuptools]
packages = ["scintegrate"]

# Read from the VERSION file rather than restated here. Restating it is how a sibling tool's
# pyproject came to say 0.1.0 while its VERSION said 0.3.0; tests/test_version.py asserts they
# agree.
[tool.setuptools.dynamic]
version = { file = "VERSION" }
