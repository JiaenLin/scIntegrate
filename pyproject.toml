[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "scintegrate"
version = "0.2.0"
description = "Is integration needed? Compare methods including none, and refuse to choose."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scikit-learn>=1.3"]

[project.optional-dependencies]
run = ["anndata>=0.10", "scanpy>=1.10", "matplotlib>=3.7"]
harmony = ["harmonypy>=0.0.9"]
bbknn = ["bbknn>=1.6"]

[project.scripts]
scintegrate = "scintegrate.cli:main"

[project.urls]
Homepage = "https://github.com/JiaenLin/scIntegrate"
