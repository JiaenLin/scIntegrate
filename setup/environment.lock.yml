# The environment scIntegrate's results were produced in, CAPTURED FROM A WORKING INSTALL rather
# than composed from bounds. The named pins below ran a cohort end to end; the closure under them
# is what they require, pinned too, so a fresh build resolves nothing for itself.
#
# WHY A LOCK AND NOT A RANGE. `pyproject.toml` declares `scanpy>=1.10` because the measurement
# layer genuinely tolerates a range. Its RESULTS do not: neither UMAP nor Leiden is
# bit-reproducible across versions, and a variational model's latent space is not reproducible
# across a change of torch. Bounds are what scIntegrate needs to IMPORT; this file is what a
# result needs to REPRODUCE. Use it when you intend to compare against a published number.
#
# THE ONE THING WORTH KNOWING BEFORE YOU INSTALL THIS. `scvi-tools` brings torch and roughly
# sixty transitive packages; `scib` brings five. Measured against the analysis stack below, the
# two together changed NOTHING that was already installed - they are additive. That is why they
# can be added to an environment that already produced results without invalidating them, and it
# is worth re-checking with `pip install --dry-run` on your own stack rather than assumed.
name: scintegrate
channels: [conda-forge, bioconda]
dependencies:
  - python=3.12.12
  - pip
  - pip:
      # --- the measurement layer. scIntegrate itself needs only these two.
      - numpy==2.4.6
      - scikit-learn==1.9.0

      # --- reading .h5ad, computing a PCA and a UMAP: everything except `doctor`
      - anndata==0.13.2
      - scanpy==1.12.3
      - scipy==1.18.0
      - pandas==3.0.5
      - h5py==3.16.0
      - numba==0.66.0
      - umap-learn==0.5.12
      - natsort==8.4.0
      - packaging==26.1
      # igraph and leidenalg are scIB's, not scanpy's: the NMI and ARI metrics cluster the
      # corrected space, and scanpy imports Leiden lazily - so a missing one surfaces after the
      # models have trained rather than before.
      - igraph==1.0.0
      - leidenalg==0.12.0

      # --- figures. The report is written WITHOUT these: every figure becomes a named absence
      # and the document is still produced. Installed here because you almost certainly want the
      # pictures, not because the tool needs them to run.
      - matplotlib==3.11.1
      - seaborn==0.13.2

      # --- the methods, one line each. Any of them may be omitted; the method is then named in
      # the report as not compared, rather than quietly missing from the comparison.
      - harmonypy==0.0.10
      # holds harmony's fit at one thread (GAP-C54); the version the cluster install carries
      - threadpoolctl==3.6.0
      - bbknn==1.6.0

      # --- the benchmark. Without scib the run still happens and the kNN metrics are still
      # reported, but NO DEFAULT EMBEDDING IS CHOSEN, because the choice is defined as the scIB
      # total. scikit-misc is its highly-variable-gene backend.
      - scib==1.1.7
      - scikit-misc==0.5.2

      # --- scVI and scANVI. One package, two models. This is the heavy half of the install.
      # torch is pinned because a latent space is not reproducible across a change of it.
      - scvi-tools==1.5.0.post1
      - torch==2.13.0
      - lightning==2.6.5
      - pytorch-lightning==2.6.5
      - torchmetrics==1.9.0
      - pyro-ppl==1.9.1

      # --- THE CLOSURE: everything the pins above require, on linux x86_64 under CPython 3.12.12.
      # Pinned because the manager's pip step is `pip install -U -r`: an unpinned requirement is
      # resolved to its newest release on the day of the build, whatever this file says. That is how
      # pynndescent 0.7.0 reached a sibling tool's fresh build and killed scanpy's neighbour graph on
      # every object of 8,192 cells or more (single-cell-harness GAP-C82). Versions shared with
      # scQC's lock are scQC's (the interpreter the stages before this one run in); the rest are
      # pip's choice for this platform as of 2026-08-17, when the pins above were captured.
      # What each requires is recorded in environment.lock.requires.tsv and checked by
      # tests/test_the_lock_pins_its_closure.py. A CUDA wheel set is part of torch's closure on linux.
      - absl-py==2.5.0
      - aiohappyeyeballs==2.7.1
      - aiohttp==3.14.3
      - aiosignal==1.4.0
      - annotated-types==0.8.0
      - annoy==1.17.3
