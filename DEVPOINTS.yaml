# What can be added to scIntegrate. Read by `sch dev map`; see the harness's sch/dev/points.py.
tool: scintegrate
devpoints: 1
# The word list this repository must not contain lives OUTSIDE it, in the project that owns
# the cohort: $SCINTEGRATE_FORBIDDEN_TERMS, the convention tests/test_portability.py already uses.
# A tool that ships the vocabulary in order to check that it does not ship the vocabulary
# has shipped it.

tests:
  # `--jobs {jobs}` is filled from the scheduler's allocation, or the CPU count off a
  # scheduler. One subprocess per suite either way; only the waiting is removed. Measured
  # IDENTICAL to the serial report on this suite set (PBS 707231) before being turned on.
  command: ["{python}", "tests/run_all.py", "--jobs", "{jobs}"]

# `none` is always included: it is the baseline every method is measured against, and a fixture
# run that omits it would score a method against nothing. One method plus the baseline keeps the
# run to seconds on 2,000 cells.
#
# `--species` is required and has no default. The harness fixture's genes are human symbols
# (sch/dev/fixture.py REAL_GENES) and it carries no gene identifiers, so the declaration can be
# read only against the symbol case - which is what the run then records. The fixture declares no
# assay - it is synthetic, neither cells nor nuclei - and the run records "not declared".
fixture:
  command: ["{python}", "-m", "scintegrate.cli", "integrate",
            "--h5ad", "{observations}", "--out", "{out}",
            "--batch-key", "{role_sample}", "--label-key", "{role_cell_type}",
            "--species", "homo_sapiens",
            "--methods", "none,{name}", "--n-cores", "1"]
  products: ["report.json"]
  timeout: 1800

baseline_dir: tests/baselines

points:
  method:
    what: an integration method the benchmark can run, score and rank against the others
    lives: scintegrate/methods.py
    register:
      - {file: scintegrate/methods.py, table: METHODS}
      - {file: scintegrate/methods.py, table: SEES}
    # PROSE, DELIBERATELY. A bare key name in this list is checked against the artefact at
    # `lives`; a sentence is printed for a person. `state_version` was written here as a bare
    # name and is NOT a key in methods.py - it lives in the run record - so as a checked key it
    # was simply wrong.
    must_declare: ["an entry in SEES saying what it sees",
                   "a state_version in the run record it produces",
                   "the wrapped library's version in provenance"]
    example: harmony
    # The suites that hold a method to this point. tests/test_methods.py was named here and never
    # existed; tests/test_statements_true.py now fails on any name in this file that does not.
    tests: [tests/test_methods_settings.py, tests/test_design.py, tests/test_status_contract.py,
            tests/test_cohort_axes.py, tests/test_score_reads_graphs.py,
            tests/test_harmony_reproducible.py]
    proves: >
      it runs on both fixture shapes, is scored beside `none`, declares what it sees, and pads
      withheld cells with NaN rather than zero
    cannot_prove: >
      that its embedding is good, or that it is stable between executions. Harmony's fit is held
      to one thread and is bit-identical between executions on one machine
      (tests/test_harmony_reproducible.py); whether another machine gives the same bits is not
      measured, and only a repeated run on it measures that
    notes: >
      SEES is the single declaration. NEEDS_LABELS and benchmark.LABEL_SUPERVISED are DERIVED
      from it; adding a method that sees labels means adding one entry, not three.
