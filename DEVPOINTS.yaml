# What can be added to scIntegrate. Read by `sch dev map`; see the harness's sch/dev/points.py.
tool: scintegrate
devpoints: 1
terms: docs/forbidden_terms.txt

tests:
  command: ["{python}", "-m", "pytest", "-q", "tests"]

# `none` is always included: it is the baseline every method is measured against, and a fixture
# run that omits it would score a method against nothing. One method plus the baseline keeps the
# run to seconds on 2,000 cells.
fixture:
  command: ["{python}", "-m", "scintegrate.cli", "integrate",
            "--h5ad", "{observations}", "--out", "{out}",
            "--batch-key", "{role_sample}", "--label-key", "{role_cell_type}",
            "--methods", "none,{name}", "--n-cores", "1"]
  products: ["report.json"]
  timeout: 1800

baseline_dir: tests/baselines

points:
  method:
    what: an integration method the benchmark can run, score and rank against the others
    lives: scintegrate/methods.py
    register:
      - {file: scintegrate/methods.py, table: METHODS}
      - {file: scintegrate/methods.py, table: SEES}
    must_declare: [SEES entry, state_version, wrapped version in provenance]
    example: harmony
    tests: [tests/test_methods.py]
    proves: >
      it runs on both fixture shapes, is scored beside `none`, declares what it sees, and pads
      withheld cells with NaN rather than zero
    cannot_prove: >
      that its embedding is good, or that it is stable between executions - harmony's is not, by
      0.214 between two machines, and only a repeated run measures that
    notes: >
      SEES is the single declaration. NEEDS_LABELS and benchmark.LABEL_SUPERVISED are DERIVED
      from it; adding a method that sees labels means adding one entry, not three.
